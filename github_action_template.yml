name: Daily Brief

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 运行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Brief
        env:
          # 必需配置
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          
          # AI 配置 (如果启用)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_SUMMARY_ENABLED: ${{ secrets.AI_SUMMARY_ENABLED }} # 或者直接写 'true'
          
          # 翻译配置 (如果启用)
          BAIDU_FANYI_APP_ID: ${{ secrets.BAIDU_FANYI_APP_ID }}
          BAIDU_FANYI_SECRET: ${{ secrets.BAIDU_FANYI_SECRET }}
          
          # API 配置 (如果在 Secrets 中设置了覆盖)
          WEIBO_API_URL: ${{ secrets.WEIBO_API_URL }}
          WEIBO_API_BACKUP: ${{ secrets.WEIBO_API_BACKUP }}
          ZHIHU_API_URL: ${{ secrets.ZHIHU_API_URL }}
          ZHIHU_API_BACKUP: ${{ secrets.ZHIHU_API_BACKUP }}
          
          # 其他开关
          WEIBO_ENABLED: 'true'
          HN_ENABLED: 'true'
          ZHIHU_ENABLED: 'true'
        run: python main.py
